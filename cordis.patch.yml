# dsh-sql 组合包补丁：把数据库工具插件行插入 profile。
# 本补丁按 id 覆盖；用户应在自己 profile 的 cordis.patch.yml 里覆盖本行的整个
# config（见 README 的配置示例）。配置缺失时插件仍会加载，默认注册一个
# 内存 SQLite 连接（sql_list 可见）。
#
# 示例（用户 profile 的 cordis.patch.yml）：
#   - id: sql
#     name: 'dsh-sql'
#     config:
#       connections:
#         - name: local
#           engine: sqlite
#           file: E:\data\app.db
#         - name: prod
#           engine: postgres
#           url: postgres://readonly_user@db.internal:5432/app?sslmode=verify-full
#           ssl: require       # disable / allow / prefer / require / verify-ca / verify-full / boolean / { rejectUnauthorized, ca }
#           readOnly: true     # 单连接只读锁（仅禁止该连接写入）
#       maxRows: 1000          # sql_query 返回行数上限（1-10000，默认 1000）
#       queryTimeoutMs: 60000  # 单次查询超时（5 秒 - 10 分钟）
#       execTimeoutMs: 120000  # 单次写操作超时（5 秒 - 10 分钟）
#       readOnly: false        # true 时全局禁用 sql_exec
#       writeApproval: true    # 写操作先弹审批（默认 true，热更新即刻生效）
#       redactColumns: false   # true 启用内置敏感列脱敏，或传自定义列名/正则数组 -> [REDACTED]（热更新即刻生效）
#
- insert:
    - id: sql
      name: 'dsh-sql'
      config:
        maxRows: 1000
